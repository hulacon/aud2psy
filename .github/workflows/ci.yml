# aud2psy's first CI.
#
# The dep-light carve this repo needed was already done, by the author, before
# any CI existed: `[tool.pytest.ini_options] addopts` deselects the
# `transcription`, `weights` and `diarization` markers by default, and
# `opensmile` sits in `[dev]` with a comment saying it is there "so the egemaps
# tests run in CI (offline, no weights)". So this workflow does not carve
# anything — it installs `[dev]` and runs the suite, and the only real decision
# left was which torch.
#
# **That decision is the `--index-url` below.** Plain `pip install torch` on
# linux resolves the CUDA build and its nvidia-* wheels: measured 2026-08-29 at
# a **6.0 GB** venv (torch 2.13.0+cu130) on a machine with no GPU. The PyTorch
# CPU index serves the same torch without the payload. Nothing here needs a
# GPU; the models that run in this tier run on CPU explicitly.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, to separate "this diff broke it" from "a dependency moved under us".
  # This repo floats every bound (`torch>=2.0`, `librosa>=0.10`,
  # `transformers>=4.35`, ...) and already carries one scar from exactly that
  # class of change: transformers 5 altered what `get_text_features` returns and
  # broke the CLAP projection. A scheduled run catches the next one on its own
  # commit instead of on whoever pushes next.
  #
  # Monday 15:23 UTC — start of the working week in Eugene, off the hour, offset
  # from the sibling repos so the family does not queue against itself.
  #
  # Caveats: a scheduled failure is reported against the last commit on main,
  # which did not cause it — read the trigger before the commit. And **GitHub
  # disables a scheduled workflow in a public repo after 60 days with no
  # repository activity**, so a quiet period switches this off silently.
  schedule:
    - cron: "23 15 * * 1"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.10 is the `requires-python` floor, 3.12 the highest classifier.
      #
      # **3.13 is not merely untested, it cannot work yet.** librosa pulls
      # `audioread`, which imports `audioop` and `sunau`; PEP 594 removed both
      # from the stdlib in 3.13, and running the suite on 3.12 already prints
      # their removal warnings. Adding a 3.13 leg is blocked on audioread, not
      # on anything in this repo — don't add one expecting it to pass.
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # torch FIRST, from the CPU index, so that by the time `-e ".[dev]"`
        # resolves `torch>=2.0` the requirement is already satisfied and pip
        # does not reach for the CUDA build. Reordering these two lines silently
        # costs several GB and minutes per leg.
        #
        # ffmpeg is deliberately NOT installed. It is a real runtime requirement
        # (video and non-wav decoding) but no test in the default tier needs it:
        # fixtures are synthetic sine/noise/silence written as wav through
        # soundfile, and the dashboard's ffmpeg→mp3 embed path already has a
        # raw-wav fallback for exactly this case. Measured 2026-08-29 in a
        # container with no ffmpeg: 187 passed on both legs. If a test ever
        # needs it, `sudo apt-get install -y ffmpeg` here is the fix — the
        # runner images do not reliably ship it.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Import check
        # Cheap, and it covers what the suite structurally cannot: cli.py's
        # MODEL_REGISTRY imports models lazily (a test asserts librosa and
        # faster_whisper are NOT imported for `--help`), so a syntax error in a
        # model module nobody's test touches ships green.
        #
        # Deliberately not bare `python -m compileall -q src/`: that prints
        # "Can't list 'src/'" and **exits 0** when the path is wrong, so the day
        # the layout moves the step keeps passing while checking nothing.
        run: |
          python -c "import aud2psy; print('aud2psy', aud2psy.__version__)"
          python - <<'PY'
          import compileall, pathlib, sys

          models = sorted(pathlib.Path("src/aud2psy/models").glob("*.py"))
          if len(models) < 10:
              sys.exit(f"only {len(models)} model modules under src/aud2psy/models — layout moved?")
          print(f"compiling {len(models)} model modules + package")
          sys.exit(0 if compileall.compile_dir("src", quiet=1) else 1)
          PY

      - name: Model registry is importable
        # The registry is lazy by design — that is what keeps `--help` fast and
        # lets someone install aud2psy without the optional extras. The cost is
        # that a renamed class or moved module stays invisible until somebody
        # asks for that model. Resolving every entry CI has the dependencies for
        # turns that into a gate.
        #
        # An ImportError naming an aud2psy module is a typo in the registry and
        # is fatal; a missing third-party backend (the `beats` / `diarize` /
        # `ebind` extras are not installed here) is expected and only reported.
        run: |
          python - <<'PY'
          import importlib, sys

          from aud2psy.cli import MODEL_REGISTRY

          missing = []
          for name, entry in MODEL_REGISTRY.items():
              module_path, class_name = entry[0], entry[1]
              try:
                  cls = getattr(importlib.import_module(module_path), class_name)
              except ImportError as e:
                  if (getattr(e, "name", "") or "").startswith("aud2psy"):
                      raise SystemExit(f"registry entry {name!r} points at a module that does not exist: {e}")
                  missing.append(f"{name}: {e}")
              except AttributeError as e:
                  raise SystemExit(f"registry entry {name!r} names a class that does not exist: {e}")
              else:
                  print(f"  {name} -> {cls.__name__}")
          if missing:
              print("\nnot resolvable without the optional extras (expected):")
              for m in missing:
                  print(f"  {m}")
          PY

      - name: Tests
        # Bare `pytest`, deliberately. `addopts` in pyproject already carries
        # `-m 'not transcription and not weights and not diarization'`, and a
        # `-m` passed on the command line **replaces** it rather than adding to
        # it — writing `-m "not weights"` here would silently re-enable the
        # transcription and diarization tiers. Let pyproject own the selection.
        #
        # Measured 2026-08-29: 187 passed, 12 deselected, ~76 s on both legs.
        run: pytest -q -rs

  # There is deliberately NO scheduled job for the deselected tiers, unlike
  # viz2psy's `heavy`. It was considered; the three markers each fail a
  # different way on a GitHub runner:
  #
  #   transcription — synthesizes speech with macOS `say`. Cannot run on ubuntu
  #                   at all, and a macos runner for it is not worth the minutes.
  #   diarization   — pyannote's community-1 weights are HF-gated behind a
  #                   one-time license acceptance plus a token, so it needs a
  #                   repository secret before it can run once.
  #   weights       — 4 tests, and they do not share a dependency: two are CLAP
  #                   (~2 GB), one is CrisperWhisper (~3 GB), one needs the
  #                   `ebind` extra, which is a git dependency whose weights are
  #                   CC-BY-NC-SA. Nothing installs all four cheaply or legibly.
  #
  # viz2psy's heavy tier earned a weekly job because it was two tests behind one
  # pip dependency and a 100 MB checkpoint. This one is not that, and a
  # perpetually red or perpetually skipped job is worse than an honest absence.
  # These stay what they already were: tiers the author runs locally.
