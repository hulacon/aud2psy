[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aud2psy"
version = "0.17.0"
description = "Extract psychological and acoustic features from audio (and the audio stream of video), including time-stamped transcription"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Ben Hutchinson", email = "bhutch@uoregon.edu"},
]
keywords = [
    "audio features",
    "speech",
    "prosody",
    "transcription",
    "psychology",
    "cognitive neuroscience",
    "naturalistic stimuli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "librosa>=0.10",
    "soundfile>=0.12",
    "faster-whisper>=1.0",
    "tqdm>=4.60",
    "torch>=2.0",
    "transformers>=4.35",
    "mosqito>=1.2.1",
    # not a real aud2psy dep: mosqito 1.2.1 imports matplotlib at module
    # load (undeclared, via roughness_ecma._noise_reduction) — drop when
    # upstream fixes the import
    "matplotlib>=3.5",
]

[project.optional-dependencies]
# opensmile in dev so the egemaps tests run in CI (offline, no weights)
dev = ["pytest", "ipython", "opensmile>=2.5"]
# beat_this is not on PyPI; the git reference keeps this an opt-in extra
beats = ["beat_this @ git+https://github.com/CPJKU/beat_this"]
# gated weights (one-time HF license acceptance + token) keep this opt-in too
diarize = ["pyannote.audio>=4.0"]
# openSMILE binaries are audEERING research-license (non-commercial) — opt-in
egemaps = ["opensmile>=2.5"]
# ebind is not on PyPI; its weights are CC-BY-NC-SA 4.0 (non-commercial) — opt-in
ebind = ["ebind @ git+https://github.com/encord-team/ebind"]

[project.scripts]
aud2psy = "aud2psy.cli:main"

[project.urls]
Homepage = "https://github.com/hulacon/aud2psy"
Repository = "https://github.com/hulacon/aud2psy"
Issues = "https://github.com/hulacon/aud2psy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aud2psy = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "transcription: needs Whisper weights (downloads on cold cache) and macOS `say`",
    "weights: needs large model downloads (CLAP ~2 GB, beat_this checkpoint)",
    "diarization: needs the [diarize] extra, an HF token, and the gated community-1 weights",
]
addopts = "-m 'not transcription and not weights and not diarization'"
